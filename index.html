<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Converter</title>
    <meta name="description" content="Real-time Sign Language to Text converter using MediaPipe">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>

    <header>
        <div class="logo">
            <h1>Sign<span>Text</span></h1>
        </div>
        <div class="status-badge" id="statusBadge">OFFLINE</div>
    </header>

    <main class="container">

        <!-- Left Side: Camera & Detection -->
        <section class="camera-section glass-panel">
            <div class="video-container">
                <video id="videoElement" autoplay playsinline></video>
                <canvas id="canvasElement"></canvas>
                <div class="demo-overlay" id="demoOverlay" style="display: none;">
                    <h2>DEMO MODE</h2>
                    <p>Camera not available or access denied.</p>
                </div>
            </div>

            <div class="detection-info">
                <div class="detected-letter">
                    <span id="currentLetter">-</span>
                </div>
                <div class="details">
                    <p class="description" id="signDescription">Waiting for hand...</p>
                    <p class="confidence" id="confidenceValue">Confidence: 0%</p>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="holdProgressBar"></div>
            </div>
            <p class="hold-text">Hold sign for 1.5s to confirm</p>
        </section>

        <!-- Right Side: Output & Controls -->
        <section class="output-section">

            <div class="current-word glass-panel">
                <h3>Current Word</h3>
                <div class="word-display" id="currentWordDisplay">
                    <span id="wordText"></span><span class="cursor">|</span>
                </div>
            </div>

            <div class="full-sentence glass-panel">
                <h3>Sentence Output</h3>
                <div class="sentence-display" id="sentenceText"></div>
            </div>

            <div class="controls glass-panel">
                <button id="btnStartCamera" class="btn primary">Start Camera</button>
                <button id="btnSpace" class="btn secondary">Space / Add Word</button>
                <button id="btnClear" class="btn danger">Clear All</button>
            </div>

            <div class="stats glass-panel">
                <div class="stat-box">
                    <h4>Letters</h4>
                    <span id="statLetters">0</span>
                </div>
                <div class="stat-box">
                    <h4>Words</h4>
                    <span id="statWords">0</span>
                </div>
            </div>

        </section>

    </main>

    <!-- Bottom Section: ASL Reference Grid -->
    <section class="reference-section glass-panel">
        <h3>ASL Alphabet Reference</h3>
        <div class="asl-grid" id="aslGrid">
            <!-- Grid items generated by JS -->
        </div>
    </section>

    <!-- Scripts -->
    <script src="gestures.js"></script>
    <script src="app.js"></script>
</body>

</html>
